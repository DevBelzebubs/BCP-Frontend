<div class="min-h-screen flex">
  <div class="w-[30%] bg-[#022b95] flex flex-col items-center justify-center p-8">
    <img src="assets/img/imglogin.jpg" alt="Banca por Internet" class="w-128 mb-8 rounded-lg">
  </div>

  <div class="w-[70%] flex flex-col bg-gray-50">
    <div class="flex justify-end p-6">
      <div class="flex items-center gap-2 text-[#002a8d] font-mono text-lg font-bold bg-white px-4 py-2 rounded-lg shadow-sm border border-gray-200">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span [class.text-red-500]="timeLeft() <= 30">{{ formatTime() }}</span>
      </div>
    </div>

    <div class="flex-1 flex items-center justify-center px-8">
      <div class="w-full max-w-md">
        <h2 class="text-[#002a8d] text-3xl font-bold mb-2">Iniciar Sesión</h2>
        <p class="text-gray-500 mb-8 text-sm">Ingresa tus credenciales para acceder</p>

        <form (ngSubmit)="onSubmit()" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
            <input type="text" [(ngModel)]="nombre" name="nombre"
                   placeholder="Nombre de usuario o correo"
                   class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0051ff] focus:border-transparent outline-none transition-all text-sm"
                   required>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" [(ngModel)]="contrasena" name="contrasena"
                   placeholder="Ingresa tu contraseña"
                   class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0051ff] focus:border-transparent outline-none transition-all text-sm"
                   required>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Usuario</label>
            <select [(ngModel)]="tipoUsuario" name="tipoUsuario"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0051ff] focus:border-transparent outline-none transition-all text-sm bg-white"
                    required>
              <option value="" disabled>Selecciona una opción</option>
              <option value="CLIENTE">Cliente</option>
              <option value="EMPLEADO">Empleado</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Verificación</label>
            <div class="flex items-center gap-3">
              <div class="flex-1 bg-gray-200 rounded-lg px-4 py-3 text-center select-none">
                <span class="font-mono text-lg font-bold text-[#002a8d] tracking-widest">{{ captchaText() }}</span>
              </div>
              <button type="button" (click)="refreshCaptcha()"
                      class="p-3 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors"
                      title="Generar nuevo captcha">
                <svg class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
              </button>
            </div>
            <input type="text" [(ngModel)]="captchaInput" name="captchaInput"
                   placeholder="Escribe el código"
                   class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0051ff] focus:border-transparent outline-none transition-all text-sm mt-2"
                   required>
          </div>

          @if (errorMessage()) {
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
              {{ errorMessage() }}
            </div>
          }

          <button type="submit"
                  [disabled]="isLoading() || captchaInput !== captchaText()"
                  class="w-full bg-[#ff7800] hover:bg-[#e66c00] disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-bold py-3 rounded-lg transition-colors text-sm shadow-md">
            @if (isLoading()) {
              <span class="flex items-center justify-center gap-2">
                <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Ingresando...
              </span>
            } @else {
              Iniciar Sesión
            }
          </button>
        </form>

        <p class="mt-8 text-xs text-gray-400 text-center">
          Sujeto a evaluación crediticia. Ver condiciones en www.viabcp.com
        </p>
      </div>
    </div>
  </div>
</div>
