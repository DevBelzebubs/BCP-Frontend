<button [attr.type]="type()" [disabled]="isDisabled()" (click)="clicked.emit()"
        class="inline-flex items-center justify-center gap-2 font-bold transition-all active:scale-[0.98] whitespace-nowrap hover:cursor-pointer disabled:cursor-not-allowed disabled:opacity-50"
        [class]="variantClass() + ' ' + sizeClass()">
  @if (loading()) {
    <bcp-spinner size="sm" color="white" />
    <ng-content />
  } @else {
    @if (iconLeft()) {
      <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconLeft()" />
      </svg>
    }
    <ng-content />
    @if (iconRight()) {
      <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconRight()" />
      </svg>
    }
  }
</button>
