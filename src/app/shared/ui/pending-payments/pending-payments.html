<bcp-card padding="md" rounded="2xl" shadow="sm">
  <div class="flex items-center gap-2 mb-4">
    <svg class="h-5 w-5 text-[#ff7800]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <h3 class="text-lg font-bold text-[#002a8d]">Pagos Pendientes</h3>
  </div>

  @if (!hasPagos()) {
    <div class="flex flex-col items-center justify-center py-8 text-center">
      <svg class="h-12 w-12 text-[#78be20] mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <p class="text-[#5c697a] font-medium">No tienes pagos pendientes</p>
      <p class="text-[#8a99af] text-sm mt-1">Tus servicios están al día</p>
    </div>
  }

  @if (hasPagos()) {
    <div class="space-y-3">
      @for (pago of pagos(); track pago.idPago) {
        <div class="flex items-center justify-between py-3 px-4 bg-gray-50 rounded-xl">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-[#002a8d] bg-opacity-10 flex items-center justify-center">
              <svg class="h-5 w-5 text-[#002a8d]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </div>
            <div>
              <p class="text-sm font-semibold text-[#002a8d]">{{ pago.nombreServicio }}</p>
              <p class="text-xs text-[#ff7800] font-bold">Vence pronto</p>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <span class="text-lg font-bold text-[#002a8d]">{{ formatMonto(pago.montoPendiente) }}</span>
            <bcp-button variant="primary" size="sm">Pagar</bcp-button>
          </div>
        </div>
      }
    </div>
  }
</bcp-card>
