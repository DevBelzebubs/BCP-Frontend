<div class="flex items-start gap-2.5 p-3.5 border rounded-xl" [class]="containerClass()">
  <svg class="h-5 w-5 mt-0.5 shrink-0" [class]="iconClass()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconPath()" />
  </svg>
  <div class="text-sm min-w-0" [class.text-red-700]="type() === 'error'"
                      [class.text-green-800]="type() === 'success'"
                      [class.text-orange-800]="type() === 'warning'"
                      [class.text-blue-700]="type() === 'info'">
    <ng-content select="[slot=title]" />
    <ng-content />
  </div>
</div>
