<section class="relative w-full h-[500px] lg:h-[600px] overflow-hidden bg-gray-900 flex items-center group">
  
  @if (activeSlide(); as slide) {
    <div class="absolute inset-0 z-0 animate-fade-in" 
         [style.background-image]="'url(' + slide.imageBg + ')'"
         style="background-size: cover; background-position: center;">
      <div class="absolute inset-0 bg-gradient-to-r from-gray-900/90 via-gray-900/40 to-transparent"></div>
    </div>
  }

  <div class="container mx-auto px-4 xl:px-8 relative z-10">
    <div class="max-w-2xl text-white animate-fade-in">
      
      <span class="inline-block py-1 px-3 rounded-md bg-white/20 backdrop-blur-sm text-sm font-semibold mb-4 border border-white/30">
         {{ activeSlide().subtitle }}
      </span>

      <h1 class="text-4xl md:text-6xl font-bold leading-tight mb-6 drop-shadow-lg">
        {{ activeSlide().title }}
      </h1>

      <button class="px-8 py-4 rounded-full font-bold text-lg shadow-lg transition-transform hover:scale-105 text-white"
              [ngClass]="activeSlide().themeColor">
        {{ activeSlide().buttonText }}
      </button>

      <p class="mt-6 text-xs text-gray-300 opacity-80 max-w-lg">
        Sujeto a evaluación crediticia. TCEA referencial. Ver condiciones en www.viabcp.com.
      </p>

    </div>
  </div>

  @if (currentSegmentSlides().length > 1) {
    
    <button (click)="prevSlide()" 
            class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/10 hover:bg-white/30 text-white p-3 rounded-full backdrop-blur-md transition-all opacity-0 group-hover:opacity-100 z-20">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <button (click)="nextSlide()" 
            class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/10 hover:bg-white/30 text-white p-3 rounded-full backdrop-blur-md transition-all opacity-0 group-hover:opacity-100 z-20">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>

    <div class="absolute bottom-8 left-0 w-full flex justify-center gap-3 z-20">
      @for (slide of currentSegmentSlides(); track $index) {
        <button (click)="goToSlide($index)" 
                class="w-3 h-3 rounded-full transition-all duration-300"
                [ngClass]="{
                  'bg-white scale-125': currentSlideIndex() === $index,
                  'bg-white/40 hover:bg-white/60': currentSlideIndex() !== $index
                }">
        </button>
      }
    </div>
  }

</section>
