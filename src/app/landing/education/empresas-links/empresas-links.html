<!-- Se aplica un fondo ligeramente celeste grisáceo (#f4f7fb) a toda la sección -->
<section class="w-full bg-[#f4f7fb] py-12 lg:py-16">
  <div class="container mx-auto px-4 xl:px-8">
    
    <!-- Título de la sección -->
    <h2 class="text-2xl md:text-3xl font-bold text-[#002a8d] mb-8">
      Enlaces útiles para ti
    </h2>

    <!-- Grilla de 4 columnas -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 lg:gap-8">
      
      @for (item of links(); track item.title) {
        <!-- Tarjeta (Enlace interactivo) -->
        <a [href]="item.link" class="group flex flex-col bg-white rounded-[20px] p-8 shadow-[0_4px_20px_rgba(0,0,0,0.03)] hover:-translate-y-1 hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] transition-all duration-300 min-h-[220px]">
          
          <!-- Contenedor del ícono circular -->
          <div class="w-10 h-10 rounded-full bg-[#f4f7fb] flex items-center justify-center mb-6 shrink-0">
            <div class="text-[#ff7800]">
              @switch (item.iconName) {
                @case ('laptop') {
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                }
                @case ('thumbs-up') {
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.514" />
                  </svg>
                }
                @case ('paper-plane') {
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                  </svg>
                }
                @case ('check-circle') {
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                }
              }
            </div>
          </div>

          <!-- Título de la tarjeta -->
          <h3 class="text-[#002a8d] text-lg lg:text-[20px] font-medium leading-tight mb-8">
            {{ item.title }}
          </h3>

          <!-- Link Call to Action que se alinea siempre al fondo -->
          <div class="mt-auto flex items-center gap-1.5 text-[#ff7800] text-[13px] font-medium">
            Conoce más
            <svg class="w-4 h-4 transform transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </div>
          
        </a>
      }

    </div>
  </div>
</section>
