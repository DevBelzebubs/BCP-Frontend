<section class="w-full py-8 lg:py-12">
  <div class="container mx-auto px-4 xl:px-8">
    
    <div class="relative bg-[#f2f6fc] rounded-[24px] md:rounded-[32px] flex flex-col md:flex-row items-center justify-between px-6 md:px-12 pt-8 md:pt-0 overflow-hidden shadow-sm">
      
      <div class="relative w-full md:w-[30%] lg:w-[25%] flex justify-center self-end shrink-0">
        
        <div class="absolute bottom-4 md:bottom-8 left-1/2 -translate-x-1/2 w-48 h-48 md:w-56 md:h-56 bg-[#dbe7f7] rounded-[45%_55%_70%_35%/40%_50%_60%_50%] z-0"></div>
        
        <img [src]="bannerData().imageUrl" 
             [alt]="bannerData().imageAlt" 
             class="relative z-10 w-48 md:w-56 lg:w-64 h-auto object-contain object-bottom">
      </div>

      <div class="flex-1 text-center md:text-left z-10 py-6 md:py-12 md:pl-8 lg:pl-12 pr-0 md:pr-6">
        <h2 class="text-[22px] md:text-3xl lg:text-[34px] font-bold text-[#002a8d] leading-tight mb-3 md:mb-4">
          {{ bannerData().title }}
        </h2>
        <p class="text-[15px] md:text-base text-[#5c697a] font-medium">
          {{ bannerData().subtitle }}
        </p>
      </div>

      <div class="shrink-0 z-10 pb-8 md:pb-0">
        <a [href]="bannerData().link" 
           class="inline-flex items-center justify-center bg-[#ff7800] hover:bg-[#e66c00] text-white font-bold text-[15px] px-8 py-3.5 rounded-full transition-colors shadow-sm min-w-[200px]">
          {{ bannerData().buttonText }}
        </a>
      </div>

    </div>
    
  </div>
</section>
