<section class="w-full bg-white py-12 lg:py-16">
  <div class="container mx-auto px-4 xl:px-8">
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 lg:gap-8 items-center lg:items-stretch">
      
      <div class="col-span-1 flex flex-col justify-center mb-6 lg:mb-0 lg:pr-4">
        <span class="text-[11px] font-bold text-[#8a99af] uppercase tracking-[0.15em] mb-4">
          Educación
        </span>
        <h2 class="text-3xl md:text-[36px] font-bold text-[#002a8d] leading-[1.15] mb-8">
          ¡Únete al 1.4 MILLONES de capacitados!
        </h2>
        <a href="#" class="group inline-flex items-center gap-2 text-[#ff7800] font-semibold text-sm hover:text-[#e66c00] transition-colors w-fit">
          Ir al Campus ABC
          <svg class="h-4 w-4 transform transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </a>
      </div>

      @for (item of educationItems(); track item.title) {
        <a [href]="item.link" class="group relative block w-full rounded-[20px] overflow-hidden min-h-[280px] lg:min-h-[320px] shadow-sm transform transition-all duration-300 hover:-translate-y-1 hover:shadow-lg">
          <img [src]="item.image" [alt]="item.title" 
               class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent"></div>
          <div class="absolute inset-0 flex flex-col justify-end p-5 md:p-6 z-10">
            <span class="bg-[#0051ff] text-white text-[12px] font-bold px-3 py-1 rounded-md mb-3 w-fit">
              {{ item.badge }}
            </span>
            <h3 class="text-white font-bold text-xl leading-snug mb-2">
              {{ item.title }}
            </h3>
            <div class="flex items-center justify-between gap-4">
              <p class="text-white/90 text-sm font-medium line-clamp-2">
                {{ item.description }}
              </p>
              <svg class="h-5 w-5 text-white shrink-0 transform transition-transform duration-300 group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </div>
          </div>
        </a>
      }

    </div>
  </div>
</section>
