<div class="min-h-screen relative overflow-hidden bg-gradient-to-br from-gray-50 via-[#f4f7ff] to-[#eef3ff]">
  <div class="pointer-events-none absolute inset-0 z-0" aria-hidden="true">
    <img src="assets/img/bcp-logo.png" alt=""
         class="absolute bottom-[-30px] right-[-40px] w-[380px] -rotate-6 opacity-[0.03]" />

    <svg class="absolute top-16 right-24 w-72 h-72 opacity-[0.05] text-[#002a8d]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
      <circle cx="12" cy="12" r="9" />
      <path stroke-linecap="round" d="M12 7v10M9 9.5c0-1.1 1.34-2 3-2s3 .9 3 2c0 .7-.45 1.2-1.2 1.55M9 14.5c.5.9 1.6 1.5 3 1.5s2.5-.6 3-1.5" />
    </svg>

    <svg class="absolute left-64 top-1/3 w-56 h-56 opacity-[0.04] text-[#ff7800]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
      <rect x="3" y="6" width="18" height="13" rx="2" />
      <path stroke-linecap="round" d="M3 10h18M7 15h3" />
    </svg>

    <svg class="absolute bottom-24 left-40 w-60 h-60 opacity-[0.04] text-[#002a8d]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
    </svg>

    <svg class="absolute top-40 right-1/3 w-48 h-48 opacity-[0.04] text-[#0051ff]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
    </svg>
  </div>

  <app-dashboard-sidebar [open]="sidebarOpen()" [navItems]="navItems" (close)="closeSidebar()" />

  @if (sidebarOpen()) {
    <div class="fixed inset-0 bg-black/30 backdrop-blur-sm z-30 lg:hidden" (click)="closeSidebar()"></div>
  }

  <div class="relative z-10 flex flex-col min-h-screen lg:ml-[350px] max-w-[calc(100%-0px)] transition-all duration-300">
    <div class="lg:ml-[-70px]">
      <app-dashboard-header (toggleMenu)="toggleSidebar()" />
    </div>
    <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-[92rem] w-full">
      <router-outlet />
    </main>
  </div>
</div>
