<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 lg:px-6 sticky top-0 z-30">
  <div class="flex items-center gap-4">
    <button (click)="toggleMenu.emit()" class="lg:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors">
      <svg class="h-6 w-6 text-[#002a8d]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <h1 class="text-lg font-bold text-[#002a8d] hidden sm:block">Banca por Internet</h1>
  </div>

  <div class="flex items-center gap-4">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-[#002a8d] flex items-center justify-center">
        <span class="text-white text-sm font-bold">{{ userName().charAt(0).toUpperCase() }}</span>
      </div>
      <div class="hidden sm:block">
        <p class="text-sm font-semibold text-[#002a8d]">{{ userName() }}</p>
        <p class="text-xs text-[#8a99af]">Cliente</p>
      </div>
    </div>

    <button (click)="cerrarSesion()"
            class="flex items-center gap-2 px-3 py-2 text-sm text-[#5c697a] hover:text-red-600 hover:bg-red-50 rounded-lg transition-all duration-200">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span class="hidden sm:inline">Cerrar Sesión</span>
    </button>
  </div>
</header>
