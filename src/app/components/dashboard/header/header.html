<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 lg:px-6 sticky top-0 z-30">
  <div class="flex items-center gap-4">
    <button (click)="toggleMenu.emit()" class="lg:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors" aria-label="Menú">
      <svg class="h-6 w-6 text-[#002a8d]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <span class="text-sm text-[#8a99af] hidden sm:block">{{ currentTime() }}</span>
  </div>

  <div class="flex items-center gap-3">
    <button class="relative p-2 rounded-lg hover:bg-gray-100 transition-colors text-[#5c697a] hover:text-[#002a8d]" aria-label="Notificaciones">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
      </svg>
      <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-[#ff7800] rounded-full"></span>
    </button>

    <div class="h-6 w-px bg-gray-200 hidden sm:block"></div>

    <div class="flex items-center gap-2 pl-1">
      <div class="w-8 h-8 rounded-full bg-[#002a8d] flex items-center justify-center shrink-0">
        <span class="text-white text-sm font-bold">{{ userName().charAt(0).toUpperCase() }}</span>
      </div>
      <div class="hidden sm:block">
        <p class="text-sm font-semibold text-[#002a8d] leading-tight">{{ userName() }}</p>
        <p class="text-[11px] text-[#8a99af]">{{ userRole() }}</p>
      </div>
    </div>

    <button (click)="cerrarSesion()"
            class="flex items-center gap-1.5 px-2.5 py-2 text-sm text-[#5c697a] hover:text-red-600 hover:bg-red-50 rounded-lg transition-all duration-200">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    </button>
  </div>
</header>
