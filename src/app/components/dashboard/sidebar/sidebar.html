<aside class="fixed top-0 left-0 z-40 h-full bg-[#002a8d] transition-transform duration-300 w-[280px] hidden lg:flex flex-col">
  <div class="flex items-center gap-3 px-6 h-16 border-b border-white border-opacity-10">
    <img src="assets/img/bcp-logo.png" alt="BCP" class="h-8 brightness-0 invert" />
  </div>

  <nav class="flex-1 py-6 px-3 space-y-1">
    @for (item of navItems; track item.route) {
      <a [routerLink]="item.route"
         routerLinkActive="bg-white bg-opacity-10 text-[#ff7800] border-l-4 border-[#ff7800]"
         class="flex items-center gap-3 px-4 py-3 rounded-lg text-white text-opacity-80 hover:text-white hover:bg-white hover:bg-opacity-5 transition-all duration-200 border-l-4 border-transparent text-sm font-medium">
        <div class="w-5 h-5 flex items-center justify-center shrink-0">
          @switch (item.icon) {
            @case ('home') {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
            }
            @case ('bank') {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
              </svg>
            }
            @case ('card') {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            }
            @case ('wallet') {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
              </svg>
            }
            @case ('user') {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            }
          }
        </div>
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="px-3 pb-6">
    <a routerLink="/" class="flex items-center gap-3 px-4 py-3 rounded-lg text-white text-opacity-60 hover:text-opacity-100 hover:bg-white hover:bg-opacity-5 transition-all text-sm">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Volver al inicio
    </a>
  </div>
</aside>
