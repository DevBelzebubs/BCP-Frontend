<div class="space-y-6">

    <p class="text-white/70 mt-1">Bienvenido, {{ userName }}</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <a routerLink="/dashboard/backoffice/supervision" class="bg-white rounded-2xl border border-gray-100 p-5 hover:shadow-lg transition-all group">

      <p class="text-xs text-[#8a99af] mt-1">Conciliar operaciones</p>
    </a>
    <a routerLink="/dashboard/backoffice/services" class="bg-white rounded-2xl border border-gray-100 p-5 hover:shadow-lg transition-all group">
      <div class="w-12 h-12 rounded-xl bg-orange-50 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
        <svg class="w-6 h-6 text-[#ff7800]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>

    <a routerLink="/dashboard/backoffice/claims" class="bg-white rounded-2xl border border-gray-100 p-5 hover:shadow-lg transition-all group">
      <div class="w-12 h-12 rounded-xl bg-red-50 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
        <svg class="w-6 h-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
