<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
    <div>
      <h1 class="text-2xl font-bold text-[#002a8d]">Retiro en Ventanilla</h1>
      <p class="text-sm text-[#8a99af] mt-1">Registrar retiro en efectivo</p>
    </div>
    <a routerLink="/dashboard/empleado/overview" class="text-sm text-[#0051ff] hover:text-[#ff7800] font-medium transition-colors">← Volver</a>
  </div>

  @if (!success()) {
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 sm:p-6 max-w-lg">
      <div class="space-y-4">
        <bcp-input label="DNI del Cliente" placeholder="12345678" [(value)]="clienteDni" />
        <bcp-input label="Número de Cuenta" placeholder="000-000000-0" [(value)]="numeroCuenta" />
        <bcp-input label="Monto" type="number" placeholder="0.00" [(value)]="monto" />
        @if (error()) { <bcp-alert type="error">{{ error() }}</bcp-alert> }
        <bcp-button variant="primary" size="full" (click)="onSubmit()" [loading]="loading()">Realizar Retiro</bcp-button>
      </div>
    </div>
  } @else {
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center max-w-lg">
      <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h3 class="text-xl font-bold text-[#002a8d] mb-2">Retiro Registrado</h3>
      <p class="text-[#5c697a] mb-6">El retiro se ha registrado exitosamente.</p>
      <bcp-button variant="primary" size="md" (click)="reset()">Nuevo Retiro</bcp-button>
    </div>
  }
</div>
